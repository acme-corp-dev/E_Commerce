server:
  port: 8081

spring:
  application:
    name: auth
  datasource:
    url: ${DB_URL:jdbc:h2:mem:auth;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

jwt:
  secret: ${JWT_SECRET:}
