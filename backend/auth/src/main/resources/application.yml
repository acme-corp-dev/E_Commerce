server:
  port: 8081

spring:
  application:
    name: auth
  h2:
    console:
      enabled: true

# Configuration injectée par variables d'environnement en prod.
# Valeurs par défaut H2 in-memory pour dev/CI uniquement.
app:
  datasource:
    url: ${APP_DB_URL:jdbc:h2:mem:auth}
    username: ${APP_DB_USER:sa}
    password: ${APP_DB_PASSWORD:}

jwt:
  secret: ${JWT_SECRET:}
